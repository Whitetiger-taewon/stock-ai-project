name: Weekly Stock Report Sender

on:
  schedule:
    # 매주 월요일 아침 8시(한국시간) 실행
    - cron: '0 23 * * 0' 
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 최신 버전으로 업데이트

      - name: Set up Python
        uses: actions/setup-python@v5 # 최신 버전으로 업데이트
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install finance-datareader pandas
          # email_test.py에서 쓰는 다른 라이브러리가 있다면 여기에 추가하세요.

      - name: Run email script
        env:
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python email_test.py
