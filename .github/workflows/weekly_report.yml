name: Weekly Stock Report Sender

on:
  schedule:
    - cron: '0 23 * * 0' 
  workflow_dispatch:

# 1. 최상단에 이 설정을 배치하여 경고를 억제합니다.
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install finance-datareader pandas scipy 

      - name: Run AI Engine and Send Email
        env:
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: |
          python final_engine_v1.py
          python email_test.py
