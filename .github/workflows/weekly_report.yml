name: Weekly Stock Report Sender

on:
  schedule:
    - cron: '0 23 * * 0' 
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # ✨ 매직 키워드: 설치된 라이브러리를 캐싱합니다.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 필요한 것만 최소화해서 설치 (plotly 제외 등)
          pip install finance-datareader pandas scipy 

      - name: Run AI Engine and Send Email
        env:
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: |
          python final_engine_v1.py
          python email_test.py
