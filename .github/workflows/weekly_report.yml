name: Weekly Stock Report Sender

on:
  schedule:
    - cron: '0 23 * * 0'  # 매주 일요일 밤 11시 (한국 시간 월요일 오전 8시)
  workflow_dispatch:      # 수동 실행 버튼 활성화

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 한글 폰트(나눔) 설치 명령어 추가
          sudo apt-get update -y
          sudo apt-get install -y fonts-nanum
          
          pip install finance-datareader pandas scipy matplotlib
          pip install -r requirements.txt 

      - name: Run AI Engine and Send Email
        env:
          # 🔑 금고(Secrets)에서 값을 꺼내 파이썬 환경변수로 매핑합니다.
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }} # 👈 이 줄을 반드시 추가!
        run: |
          python final_engine_v1.py
          python email_test.py
